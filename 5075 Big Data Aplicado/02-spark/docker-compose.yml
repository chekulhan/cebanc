
services:

  # SPARK MASTER
  spark-master:
    image: apache/spark:4.3.0-python3
    container_name: spark-master
    hostname: spark-master
    volumes:
      - ./data:/opt/spark-data
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-network

  # SPARK WORKER
  spark-worker:
    image: apache/spark:4.3.0-python3
    container_name: spark-worker
    volumes:
      - ./data:/opt/spark-data
    hostname: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --host spark-worker
      --cores 2
      --memory 2G
    depends_on:
      - spark-master
    networks:
      - spark-network

  # JUPYTER NOTEBOOK
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: jupyter
    hostname: jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./data:/opt/spark-data
      - ./notebooks:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: student
    command: start-notebook.py
    depends_on:
      - spark-master
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
